<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>storelens — e-com spy</title>
<style>
  :root{
    --side:#0b0b0e;--side2:#17171c;--side-tx:#e9e9ee;--side-mut:#7f8090;--side-line:#232329;
    --bg:#ffffff;--soft:#f5f7fb;--line:#e9ecf2;--line2:#dfe3ec;
    --tx:#0e1526;--mut:#5f6b82;--dim:#9aa3b4;
    --blue:#2f6bff;--blue600:#1e54e6;--blue-bg:#eaf1ff;--blue-bg2:#d8e5ff;
    --gn:#18b45f;--gn-bg:#e6f7ee;--am:#e08600;--am-bg:#fdf1df;--rd:#e5484d;--yl:#f5b301;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sh:0 1px 2px rgba(14,21,38,.05),0 4px 14px rgba(14,21,38,.04);--sh2:0 12px 34px rgba(14,21,38,.14);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none} button{font-family:inherit}
  code,.mono{font-family:var(--mono)} .mut{color:var(--mut)} .dim{color:var(--dim)} .hidden{display:none!important}
  img{max-width:100%;display:block}
  ::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:#d7dbe4;border-radius:8px}

  .app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  @media(max-width:900px){.app{grid-template-columns:1fr}}
  .sidebar{background:var(--side);color:var(--side-tx);padding:16px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;gap:3px}
  @media(max-width:900px){.sidebar{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto}}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.02em;padding:8px 8px 14px}
  .brand .d{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--blue),#7aa4ff);position:relative;box-shadow:0 4px 12px rgba(47,107,255,.5)}
  .brand .d::after{content:"";position:absolute;inset:7px;border:2px solid #fff;border-radius:50%}
  .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--side-mut);padding:12px 10px 6px;font-weight:700}
  @media(max-width:900px){.sec{display:none}}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--side-mut);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  .nav a .i{width:18px;text-align:center}
  .nav a:hover{background:var(--side2);color:var(--side-tx)} .nav a.on{background:var(--side2);color:#fff} .nav a.on .i{color:var(--blue)}
  .nav a.soon{opacity:.4;cursor:default} .nav a.soon:hover{background:none;color:var(--side-mut)}
  .nav a .tag{margin-left:auto;font-size:9px;font-weight:700;color:var(--blue);background:var(--blue-bg);border-radius:5px;padding:1px 6px}
  .nav a .tag.s{color:var(--side-mut);background:var(--side2)}
  .cta{margin:14px 6px 10px;padding:11px;border-radius:11px;background:var(--blue);color:#fff;font-weight:700;font-size:14px;text-align:center;cursor:pointer;box-shadow:0 6px 16px rgba(47,107,255,.4)}
  .side-foot{margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px 8px;border-top:1px solid var(--side-line)}
  @media(max-width:900px){.side-foot,.cta{display:none}}
  .side-foot .av{width:30px;height:30px;border-radius:8px;background:var(--blue);display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff}
  .side-foot .u{font-size:12.5px}.side-foot .u b{display:block;font-size:13px}.side-foot .u span{color:var(--side-mut)}

  .main{min-width:0}
  .hd{display:flex;align-items:center;gap:16px;padding:18px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);z-index:20}
  .hd h1{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:0}
  .count{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--mut);background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:3px 9px}
  .searchbox{flex:1;max-width:440px;display:flex;align-items:center;gap:9px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:0 13px;margin-left:auto}
  .searchbox input{border:none;background:none;outline:none;padding:10px 0;font-size:13.5px;width:100%;color:var(--tx);font-family:inherit}
  .content{padding:20px 26px 70px}
  @media(max-width:900px){.hd,.content{padding-left:16px;padding-right:16px}}

  .qtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .qtab{font-size:13px;font-weight:600;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 13px;cursor:pointer;white-space:nowrap;transition:.12s}
  .qtab:hover{border-color:var(--line2)} .qtab.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .filters{display:flex;gap:9px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:14px}
  .fwrap{position:relative}
  .fpill{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;white-space:nowrap}
  .fpill.act{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
  .fpill .c{color:var(--dim);font-size:10px}
  .menu{position:absolute;top:110%;left:0;z-index:30;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh2);padding:6px;min-width:190px;max-height:280px;overflow:auto}
  .menu div{padding:8px 11px;border-radius:8px;font-size:13.5px;cursor:pointer;font-weight:500}
  .menu div:hover{background:var(--soft)} .menu div.on{background:var(--blue-bg);color:var(--blue);font-weight:600}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .sortsel{position:relative}
  .empty{padding:40px;text-align:center;color:var(--mut)}

  .tbl{border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
  .trow{display:grid;grid-template-columns:2.1fr 1.5fr 1.25fr 1.15fr 1.15fr 1.25fr;gap:16px;padding:15px 16px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;transition:.1s}
  .trow:last-child{border-bottom:none} .trow.head{background:var(--soft);font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;cursor:default;padding:12px 16px}
  .trow:not(.head):hover{background:var(--soft)}
  @media(max-width:1050px){.trow{grid-template-columns:2fr 1.4fr 1.2fr}.trow .c-ads,.trow .c-meta{display:none}}
  .shopinfo{display:flex;gap:12px;align-items:center;min-width:0}
  .shopinfo .thumb{width:86px;height:58px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--soft);flex:0 0 86px}
  .shopinfo .thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
  .shopinfo .nm{font-weight:750;font-size:14.5px;display:flex;align-items:center;gap:7px}
  .shopinfo .fav{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:inline-grid;place-items:center;overflow:hidden;background:#fff;flex:0 0 22px;font-size:11px;font-weight:800;color:var(--blue)}
  .shopinfo .fav img{width:14px;height:14px;object-fit:contain}
  .shopinfo .dm{font-family:var(--mono);font-size:11.5px;color:var(--mut);margin-top:2px;display:flex;align-items:center;gap:6px}
  .badge-sh{font-size:8.5px;font-weight:700;color:#fff;background:#95bf47;border-radius:4px;padding:1px 5px}
  .shopinfo .meta{font-size:11px;color:var(--dim);margin-top:3px}
  .tp{display:inline-flex;align-items:center;gap:3px;color:var(--gn);font-weight:700}
  .bestsell{display:flex;align-items:center;gap:6px}
  .bestsell .p{width:50px;height:50px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--soft);flex:0 0 50px}
  .bestsell .p img{width:100%;height:100%;object-fit:cover}
  .bestsell .cnt{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:4px;margin-left:2px;white-space:nowrap}
  .cats{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
  .cat{font-size:11px;font-weight:600;color:var(--tx);background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:3px 9px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .metric .v{font-weight:800;font-size:16px}
  .metric .flags{font-size:12.5px;letter-spacing:1px;margin-top:2px}
  .dotv{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px}
  .dotv .dot{width:8px;height:8px;border-radius:50%;background:var(--gn)}
  .grow{font-size:11px;font-weight:700;margin-left:4px}.grow.up{color:var(--gn)}.grow.dn{color:var(--rd)}
  .creas{display:flex;gap:6px}
  .creas .cr{width:50px;height:66px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--soft);position:relative}
  .creas .cr img{width:100%;height:100%;object-fit:cover}
  .creas .cr .pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:12px;text-shadow:0 1px 5px rgba(0,0,0,.7)}

  .plat{display:flex;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:4px}
  .plat button{border:none;background:none;font-weight:700;font-size:13.5px;color:var(--mut);padding:7px 13px;border-radius:8px;cursor:pointer}
  .plat button.on{background:#fff;color:var(--tx);box-shadow:var(--sh)}
  .masonry{columns:4;column-gap:16px}
  @media(max-width:1250px){.masonry{columns:3}}@media(max-width:820px){.masonry{columns:2}}@media(max-width:520px){.masonry{columns:1}}
  .adc{break-inside:avoid;margin-bottom:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh);background:#fff}
  .adc .sub{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px}
  .adc .dr{font-size:11.5px;color:var(--mut)}.adc .dr b{color:var(--tx)}
  .adc .badges{display:flex;gap:6px}
  .adc .bd{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--mut)}
  .adc .bd.live{color:var(--gn)}.adc .bd.dup{color:var(--blue);background:var(--blue-bg)}
  .adc .adv{display:flex;align-items:center;gap:9px;padding:2px 12px 10px}
  .adc .adv .pf{width:30px;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--soft);flex:0 0 30px;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--blue)}
  .adc .adv .pf img{width:30px;height:30px;object-fit:cover}
  .adc .adv .nm{font-weight:750;font-size:13.5px;line-height:1.15}.adc .adv .sm{font-size:11px;color:var(--mut)}
  .adc .copy{padding:0 12px 10px;font-size:12.5px;color:var(--tx);line-height:1.45}
  .adc .media{position:relative;background:var(--soft)}
  .adc .media img{width:100%;object-fit:cover;display:block}
  .adc .media .pl{position:absolute;inset:0;display:grid;place-items:center}
  .adc .media .pl span{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--tx);font-size:15px;box-shadow:var(--sh)}
  .adc .cta{margin:0 12px 12px;text-align:center;font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-bg);border-radius:9px;padding:8px}

  .back{display:inline-flex;gap:7px;align-items:center;color:var(--mut);font-size:14px;cursor:pointer;margin:2px 0 18px;font-weight:600}.back:hover{color:var(--blue)}
  .shead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .shead .fav{width:56px;height:56px;border-radius:15px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);display:grid;place-items:center;overflow:hidden;font-weight:800;color:var(--blue);font-size:19px}
  .shead .fav img{width:34px;height:34px;object-fit:contain}
  .shead h1{margin:0;font-size:25px}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
  .chip{font-size:12px;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-weight:600}
  .chip.live{color:var(--gn);background:var(--gn-bg);border-color:transparent}.chip.mono{font-family:var(--mono)}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:22px 0}
  .tabs button{background:none;border:none;padding:12px 15px;font-size:14px;font-weight:650;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
  .kpirow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}@media(max-width:700px){.kpirow{grid-template-columns:1fr 1fr}}
  .stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:var(--sh)}
  .stat .v{font-weight:800;font-size:22px}.stat .v.b{color:var(--blue)}.stat .v.g{color:var(--gn)} .stat .l{font-size:12px;color:var(--mut);margin-top:3px}
  .cols{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}@media(max-width:820px){.cols{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:var(--sh)}
  .card h2{font-size:16px;margin:0;font-weight:750}
  .bars{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .bar{display:grid;grid-template-columns:44px 1fr 46px;gap:11px;align-items:center;font-size:13px}
  .bar .track{height:8px;border-radius:5px;background:var(--soft);overflow:hidden}.bar .fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--blue),#7aa4ff)}
  .bar .n{font-family:var(--mono);color:var(--mut);text-align:right;font-size:12px}
  .section-t{font-size:15px;font-weight:750;margin:26px 0 15px}
  .prods{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}@media(max-width:1080px){.prods{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){.prods{grid-template-columns:repeat(3,1fr)}}
  .prod .ph{aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}.prod .ph img{width:100%;height:100%;object-fit:cover}
  .prod .t{font-size:11.5px;color:var(--mut);margin-top:7px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .prod .p{font-weight:750;font-size:12.5px;color:var(--blue);margin-top:2px}
  .lspark{width:100%;height:150px;margin-top:12px}.lspark path.line{fill:none;stroke:var(--blue);stroke-width:2.2}.lspark path.area{fill:url(#gb)}.lspark .lbl{font-family:var(--mono);font-size:10px;fill:var(--dim)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="d"></span> storelens</div>
    <div class="sec">Overview</div>
    <div class="nav"><a class="soon"><span class="i">🏠</span> Home</a><a class="soon"><span class="i">🛰️</span> Brandtracker <span class="tag s">soon</span></a></div>
    <div class="sec">Analyse</div>
    <div class="nav">
      <a class="on" id="nav-boutiques" onclick="go('boutiques')"><span class="i">🏬</span> Boutiques</a>
      <a id="nav-ads" onclick="go('ads')"><span class="i">🎯</span> Publicités <span class="tag">New</span></a>
      <a class="soon"><span class="i">📡</span> Advertisers <span class="tag s">soon</span></a>
      <a class="soon"><span class="i">✉️</span> Emails <span class="tag s">soon</span></a>
    </div>
    <div class="cta">⚡ Choisir un plan</div>
    <div class="side-foot"><span class="av">H</span><div class="u"><b>heuss</b><span>laibhossame1@gmail.com</span></div></div>
  </aside>

  <main class="main">
    <div class="hd">
      <h1 id="hdTitle">Boutiques</h1>
      <span class="count" id="hdCount"></span>
      <div class="searchbox">🔎 <input id="searchInput" placeholder="Rechercher une boutique, un domaine, une pub…" oninput="onSearch(this.value)"></div>
    </div>
    <div class="content">
      <div id="view-boutiques">
        <div class="qtabs" id="qtabs"></div>
        <div class="filters" id="filters"></div>
        <div class="toolbar"><div class="sortsel fwrap"><div class="fpill" id="sortPill" onclick="toggleMenu('sort',this)">↓ <span id="sortLabel">Plus pertinent</span> <span class="c">▾</span></div></div><span class="mut" id="shopResCount" style="font-size:13px"></span></div>
        <div class="tbl" id="shopTable"></div>
        <div class="empty hidden" id="shopEmpty">Aucune boutique ne correspond.</div>
      </div>
      <div id="view-ads" class="hidden">
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px"><div class="plat"><button class="on">Ⓜ Meta</button><button>♪ TikTok</button><button>G Google</button></div><span class="count">+358M</span></div>
        <div class="filters" id="filtersAds"></div>
        <div class="toolbar"><div class="fwrap"><div class="fpill" id="sortPillAds" onclick="toggleMenu('sortAds',this)">↓ <span id="sortLabelAds">Pertinence</span> <span class="c">▾</span></div></div><span class="mut" id="adResCount" style="font-size:13px"></span></div>
        <div class="masonry" id="adsMasonry"></div>
        <div class="empty hidden" id="adsEmpty">Aucune pub ne correspond.</div>
      </div>
      <div id="view-detail" class="hidden"></div>
    </div>
  </main>
</div>

<script>
const fmt=n=>n==null?"—":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(Math.round(n/100)/10)+"k":Math.round(n)+"";
const esc=s=>(s||"").replace(/</g,"&lt;");
const flag=cc=>(cc&&cc.length===2)?String.fromCodePoint(...[...cc.toUpperCase()].map(c=>127397+c.charCodeAt(0))):"";
const yearsAgo=y=>y?((2026-parseInt(y))+" ans"):"";
let DATA=null, VIEW='boutiques';
const S={search:"",sort:"relevance",cat:null,adSort:"relevance"};
const SORTS={relevance:["Plus pertinent",null],monthlyVisits:["Visites",(a,b)=>b.traffic_number-a.traffic_number],
  activeAds:["Ads actives",(a,b)=>(b.active_ads_total||0)-(a.active_ads_total||0)],
  products:["Produits",(a,b)=>(b.products_count||0)-(a.products_count||0)],
  trustpilot:["Trustpilot",(a,b)=>(b.trustpilot_score||0)-(a.trustpilot_score||0)],
  growth:["Croissance",(a,b)=>(b.growth_ads_7d||0)-(a.growth_ads_7d||0)]};
const ADSORTS={relevance:["Pertinence",null],recent:["Plus récentes",(a,b)=>(b.start_date||"").localeCompare(a.start_date||"")],
  scaling:["Scaling",(a,b)=>(b.collation_count||0)-(a.collation_count||0)],longest:["Longévité",(a,b)=>(b.days_running||0)-(a.days_running||0)]};
const QTABS=[["all","🌍 Toutes","relevance"],["gems","💎 Weekly Gems","trustpilot"],["scaling","📈 Top Scaling","growth"],["leaders","🏆 Market Leaders","monthlyVisits"],["peak","🔥 Ad Peak","activeAds"]];

fetch("data/demo.json?v=7").then(r=>r.json()).then(d=>{DATA=d;initFilters();renderShops();renderAds();})
  .catch(e=>{document.getElementById('shopTable').innerHTML='<div class="empty">Erreur data/demo.json</div>';});

function go(v){VIEW=v;['boutiques','ads','detail'].forEach(x=>document.getElementById('view-'+x).classList.add('hidden'));
  document.getElementById('view-'+v).classList.remove('hidden');
  document.getElementById('nav-boutiques').classList.toggle('on',v==='boutiques');
  document.getElementById('nav-ads').classList.toggle('on',v==='ads');
  const t={boutiques:'Boutiques',ads:'Publicités',detail:''}[v];
  document.getElementById('hdTitle').textContent=t;
  document.getElementById('hdCount').textContent=v==='boutiques'?'1.9M':(v==='ads'?'358M':'');
  document.getElementById('hdCount').style.display=t?'':'none';
  closeMenus();window.scrollTo(0,0);}

function onSearch(v){S.search=v.toLowerCase().trim(); if(VIEW==='ads')renderAds(); else {if(VIEW==='detail')go('boutiques'); renderShops();}}

/* filters + menus */
function initFilters(){
  document.getElementById('qtabs').innerHTML=QTABS.map(([k,l])=>`<div class="qtab ${k==='all'?'on':''}" data-q="${k}" onclick="setQtab('${k}','${QTABS.find(x=>x[0]===k)[2]}')">${l}</div>`).join('');
  const allCats=[...new Set(DATA.stores.flatMap(s=>s.category||[]))].sort();
  const shopPills=[["Niche",allCats],["Trafic",["> 1M","> 500k","< 500k"]],["Croissance",["En hausse","Stable"]],["Trustpilot",["4+","3+"]],["Origine",["US","GB","EU"]],["Currency",["USD","EUR","GBP"]]];
  document.getElementById('filters').innerHTML=shopPills.map((p,i)=>`<div class="fwrap"><div class="fpill" id="fp${i}" onclick="toggleMenu('f${i}',this)">${p[0]} <span class="c">▾</span></div></div>`).join('');
  window._pills=shopPills;
  const adPills=["Statut","Type média","CTA","Pays","Jours actifs","Duplicatas","Langue","Niche"];
  document.getElementById('filtersAds').innerHTML=adPills.map(f=>`<div class="fpill">${f} <span class="c">▾</span></div>`).join('');
}
let openMenu=null;
function closeMenus(){document.querySelectorAll('.menu').forEach(m=>m.remove());openMenu=null;}
function toggleMenu(id,el){
  if(openMenu===id){closeMenus();return;} closeMenus();openMenu=id;
  const m=document.createElement('div');m.className='menu';
  let items=[];
  if(id==='sort') items=Object.entries(SORTS).map(([k,v])=>[k,v[0],()=>{S.sort=k;document.getElementById('sortLabel').textContent=v[0];syncQtab();renderShops();}]);
  else if(id==='sortAds') items=Object.entries(ADSORTS).map(([k,v])=>[k,v[0],()=>{S.adSort=k;document.getElementById('sortLabelAds').textContent=v[0];renderAds();}]);
  else if(id.startsWith('f')){const idx=+id.slice(1);const p=window._pills[idx];
    items=[["__all","Tous",()=>{if(p[0]==='Niche')S.cat=null;el.classList.remove('act');renderShops();}]].concat(p[1].map(v=>[v,v,()=>{if(p[0]==='Niche'){S.cat=v;el.classList.add('act');renderShops();}else{el.classList.add('act');}}]));}
  m.innerHTML=items.map(([k,l])=>`<div data-k="${k}" class="${(id==='sort'&&k===S.sort)||(id==='sortAds'&&k===S.adSort)||(id==='f0'&&k===S.cat)?'on':''}">${l}</div>`).join('');
  el.parentElement.appendChild(m);
  m.querySelectorAll('div').forEach((d,i)=>d.onclick=(e)=>{e.stopPropagation();items[i][2]();closeMenus();});
}
document.addEventListener('click',e=>{if(!e.target.closest('.fwrap'))closeMenus();});
function setQtab(k,sort){document.querySelectorAll('.qtab').forEach(t=>t.classList.toggle('on',t.dataset.q===k));S.sort=sort;document.getElementById('sortLabel').textContent=SORTS[sort][0];renderShops();}
function syncQtab(){const q=QTABS.find(x=>x[2]===S.sort);document.querySelectorAll('.qtab').forEach(t=>t.classList.toggle('on',q?t.dataset.q===q[0]:false));}

function miniSpark(vals,w=94,h=30){
  if(!vals||vals.length<2) return `<div style="height:${h}px;display:flex;align-items:center;color:var(--dim);font-size:11px">—</div>`;
  const mn=Math.min(...vals),mx=Math.max(...vals),x=i=>i*w/(vals.length-1),y=v=>h-2-(v-mn)/((mx-mn)||1)*(h-4);
  let d="M"+x(0).toFixed(1)+" "+y(vals[0]).toFixed(1);vals.forEach((v,i)=>{if(i)d+=" L"+x(i).toFixed(1)+" "+y(v).toFixed(1);});
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="ms" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6bff" stop-opacity=".22"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#ms)"/><path d="${d}" fill="none" stroke="#2f6bff" stroke-width="1.6"/></svg>`;
}

function filteredShops(){
  let a=DATA.stores.slice();
  if(S.search) a=a.filter(s=>(s.name+" "+s.domain+" "+(s.category||[]).join(" ")).toLowerCase().includes(S.search));
  if(S.cat) a=a.filter(s=>(s.category||[]).includes(S.cat));
  const f=SORTS[S.sort][1]; if(f) a.sort(f);
  return a;
}
function renderShops(){
  const list=filteredShops();
  document.getElementById('shopResCount').textContent=list.length+" boutiques";
  document.getElementById('shopEmpty').classList.toggle('hidden',list.length>0);
  document.getElementById('shopTable').classList.toggle('hidden',list.length===0);
  const rows=list.map(s=>{
    const idx=DATA.stores.indexOf(s);
    const fl=(s.countries&&s.countries.length?s.countries:[s.main_market]).slice(0,3).map(flag).join(' ');
    const bs=(s.products||[]).slice(0,3).map(p=>`<div class="p">${p.image?`<img src="${p.image}" loading="lazy">`:''}</div>`).join('');
    const creas=(s.creas||[]).slice(0,2).map(a=>`<div class="cr">${a.thumb?`<img src="${a.thumb}" loading="lazy">`:''}<div class="pl">${a.media_type==='video'?'▶':''}</div></div>`).join('')||'<span class="dim" style="font-size:11px">—</span>';
    const g=s.growth_ads_7d; const gr=g!=null?`<span class="grow ${g>=0?'up':'dn'}">${g>=0?'▲':'▼'}${Math.abs(Math.round(g*100))}%</span>`:'';
    const tp=s.trustpilot_score?`<span class="tp">★ ${s.trustpilot_score}</span>`:'';
    return `<div class="trow" onclick="showStore(${idx})">
      <div class="shopinfo"><div class="thumb">${s.shot?`<img src="${s.shot}" loading="lazy">`:''}</div>
        <div><div class="nm"><span class="fav">${s.logo?`<img src="${s.logo}">`:s.name.slice(0,1)}</span>${esc(s.name)}</div>
          <div class="dm">${s.domain} <span class="badge-sh">S</span></div>
          <div class="meta">🗓 ${s.creation_date||''} · ${yearsAgo(s.launch_year)} ${flag(s.main_market)} ${tp}</div></div></div>
      <div class="bestsell">${bs}<span class="cnt">📦 ${fmt(s.products_count)}</span></div>
      <div class="cats c-meta">${(s.category||[]).slice(0,2).map(c=>`<span class="cat">${esc(c)}</span>`).join('')}</div>
      <div class="metric c-meta"><div class="v">${fmt(s.traffic_number)}</div>${miniSpark(s.traffic_hist)}<div class="flags">${fl}</div></div>
      <div class="metric c-ads"><div class="dotv"><span class="dot"></span>${fmt(s.active_ads_total)}${gr}</div>${miniSpark(s.ads_hist)}<div class="flags">${fl}</div></div>
      <div class="creas c-ads">${creas}</div>
    </div>`;
  }).join('');
  document.getElementById('shopTable').innerHTML=`<div class="trow head"><div>Boutique</div><div>Best-sellers</div><div>Catégorie</div><div>Visites/mois</div><div>Meta Ads</div><div>Créas</div></div>`+rows;
}

function filteredAds(){
  let a=(DATA.ads||[]).slice();
  if(S.search) a=a.filter(x=>((x.body||"")+" "+(x.page_name||"")).toLowerCase().includes(S.search));
  const f=ADSORTS[S.adSort][1]; if(f) a.sort(f);
  return a;
}
function renderAds(){
  const list=filteredAds();
  document.getElementById('adResCount').textContent=list.length+" pubs";
  document.getElementById('adsEmpty').classList.toggle('hidden',list.length>0);
  document.getElementById('adsMasonry').innerHTML=list.map(adCard).join('');
}
function adCard(a){
  const dup=a.collation_count>1?`<span class="bd dup">⧉ ${a.collation_count}</span>`:'';
  return `<div class="adc">
    <div class="sub"><div class="dr"><b>${a.days_running!=null?a.days_running+'j':''}</b>${a.start_date?' · '+a.start_date:''}</div>
      <div class="badges">${dup}<span class="bd ${a.is_active?'live':''}">${a.is_active?'● active':'inactive'}</span></div></div>
    <div class="adv"><span class="pf">${a.avatar?`<img src="${a.avatar}">`:esc((a.page_name||'?').slice(0,1))}</span><div><div class="nm">${esc(a.page_name||'')}</div><div class="sm">${a.media_type||''}${a.is_eu?' · EU':''}</div></div></div>
    <div class="copy">${esc(a.body)||''}</div>
    <div class="media">${a.thumb?`<img src="${a.thumb}" loading="lazy">${a.media_type==='video'?'<div class="pl"><span>▶</span></div>':''}`:''}</div>
    ${a.cta?`<div class="cta">${esc(a.cta)}</div>`:''}
  </div>`;
}

function showStore(i){
  const s=DATA.stores[i];go('detail');
  const spark=(s.ads_hist&&s.ads_hist.length>1)?s.ads_hist:(s.traffic_hist||[]);
  const hk=(s.ads_hist&&s.ads_hist.length>1);
  const cs=s.ads_country_stats||{};
  document.getElementById('view-detail').innerHTML=`
    <div class="back" onclick="go('boutiques')">← toutes les boutiques</div>
    <div class="shead"><div class="fav">${s.logo?`<img src="${s.logo}">`:s.name.slice(0,2)}</div>
      <div><h1>${esc(s.name)}</h1><div class="chips">
        <span class="chip mono">${s.domain}</span>${(s.category||[]).slice(0,2).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}
        ${s.launch_year?`<span class="chip">depuis ${s.launch_year}</span>`:''}<span class="chip">Shopify</span>
        ${s.trustpilot_score?`<span class="chip">★ ${s.trustpilot_score} (${fmt(s.trustpilot_reviews)})</span>`:''}
        ${s.active_ads_total?'<span class="chip live">● ad-spy actif</span>':''}</div></div></div>
    <div class="tabs"><button class="on" data-t="ov" onclick="tab(this)">Vue d'ensemble</button>
      ${(s.creas||[]).length?'<button data-t="ads" onclick="tab(this)">Publicités Meta</button>':''}
      ${(s.products||[]).length?'<button data-t="pr" onclick="tab(this)">Produits</button>':''}</div>
    <div data-p="ov">
      <div class="kpirow">
        <div class="stat"><div class="v b">${fmt(s.active_ads_total)}</div><div class="l">ads actives</div></div>
        <div class="stat"><div class="v g">${fmt(s.traffic_number)}</div><div class="l">visites / mois</div></div>
        <div class="stat"><div class="v">${fmt(s.products_count)}</div><div class="l">produits</div></div>
        <div class="stat"><div class="v">${s.main_market||'—'} ${flag(s.main_market)}</div><div class="l">marché principal</div></div>
      </div>
      <div class="cols">
        <div class="card"><div style="display:flex;justify-content:space-between"><h2>${hk?'📈 Ads actives / semaine':'📈 Trafic / mois'}</h2><span class="dim mono" style="font-size:12px">${hk?'signal de scaling':'visites'}</span></div>${spark.length>1?bigLine(spark):'<p class="mut">Pas assez d\'historique.</p>'}</div>
        ${Object.keys(cs).length?`<div class="card"><h2>🌍 Ads par pays</h2>${bars(cs,flag)}</div>`:`<div class="card"><h2>🏷️ Infos</h2><p class="mut" style="font-size:13.5px">${(s.category||[]).join(', ')} · ${fmt(s.products_count)} produits · marché ${s.main_market}. ${s.trustpilot_score?'Trustpilot '+s.trustpilot_score+'/5.':''}</p></div>`}
      </div>
    </div>
    ${(s.creas||[]).length?`<div data-p="ads" class="hidden"><div class="section-t">🎯 Dernières publicités Meta</div><div class="masonry">${(s.creas||[]).map(a=>`<div class="adc"><div class="adv"><span class="pf">${s.logo?`<img src="${s.logo}">`:''}</span><div><div class="nm">${esc(s.name)}</div><div class="sm">${a.media_type}</div></div></div><div class="media"><img src="${a.thumb}" loading="lazy">${a.media_type==='video'?'<div class="pl"><span>▶</span></div>':''}</div></div>`).join('')}</div></div>`:''}
    <div data-p="pr" class="hidden"><div class="section-t">📦 Best-sellers</div><div class="prods">${(s.products||[]).map(p=>`<div class="prod"><div class="ph">${p.image?`<img src="${p.image}" loading="lazy">`:''}</div><div class="t">${esc(p.title)}</div><div class="p">${p.price?Math.round(p.price)+(s.currency==='EUR'?'€':'$'):''}</div></div>`).join('')}</div></div>`;
}
function tab(b){const r=document.getElementById('view-detail');r.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));r.querySelectorAll('[data-p]').forEach(p=>p.classList.toggle('hidden',p.getAttribute('data-p')!==b.dataset.t));window.scrollTo(0,0);}
function bars(o,fl){const e=Object.entries(o||{}).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=Math.max(...e.map(x=>x[1]),1);
  return `<div class="bars">${e.map(([k,v])=>`<div class="bar"><span class="mono dim">${fl?fl(k)+' '+k:k}</span><span class="track"><span class="fill" style="width:${Math.max(5,100*v/mx)}%"></span></span><span class="n">${fmt(v)}</span></div>`).join('')}</div>`;}
function bigLine(vals){const W=560,H=150,pad=10,mn=Math.min(...vals),mx=Math.max(...vals);
  const x=i=>pad+i*(W-2*pad)/(vals.length-1),y=v=>H-24-(v-mn)/((mx-mn)||1)*(H-44);
  let d="M"+x(0).toFixed(1)+" "+y(vals[0]).toFixed(1);vals.forEach((v,i)=>{if(i)d+=" L"+x(i).toFixed(1)+" "+y(v).toFixed(1);});
  return `<svg class="lspark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6bff" stop-opacity=".2"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></linearGradient></defs><path class="area" d="${d} L${x(vals.length-1)} ${H-24} L${x(0)} ${H-24} Z"/><path class="line" d="${d}"/><text class="lbl" x="${pad}" y="14">max ${fmt(mx)}</text></svg>`;}
</script>
</body>
</html>
